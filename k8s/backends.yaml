apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: retail-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: public.ecr.aws/aws-containers/retail-store-sample-catalog:1.6.1
          ports:
            - containerPort: 8080
          env:
            - name: DB_ENDPOINT
              value: "bedrock-mysql.cufyuakkkh0e.us-east-1.rds.amazonaws.com:3306"
            - name: DB_READ_ENDPOINT
              value: "bedrock-mysql.cufyuakkkh0e.us-east-1.rds.amazonaws.com:3306"
            - name: DB_NAME
              value: "retailcatalog"
            - name: DB_USER
              value: "retail_admin"
            - name: DB_PASSWORD
              value: "BedrockSecureMySql2025!"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: retail-app
spec:
  selector:
    app: catalog
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts
  namespace: retail-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carts
  template:
    metadata:
      labels:
        app: carts
    spec:
      containers:
        - name: carts
          image: public.ecr.aws/aws-containers/retail-store-sample-cart:0.7.0
          ports:
            - containerPort: 8080
          env:
            - name: RETAIL_CART_PERSISTENCE_PROVIDER
              value: "dynamodb"
            - name: RETAIL_CART_DYNAMODB_TABLENAME
              value: "bedrock-carts-table"
            - name: AWS_REGION
              value: "us-east-1"
---
apiVersion: v1
kind: Service
metadata:
  name: carts
  namespace: retail-app
spec:
  selector:
    app: carts
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: retail-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: public.ecr.aws/aws-containers/retail-store-sample-orders:0.7.0
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://bedrock-postgres.cufyuakkkh0e.us-east-1.rds.amazonaws.com:5432/retailcatalog"
            - name: SPRING_DATASOURCE_USERNAME
              value: "retail_admin"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "BedrockSecurePostgres2025!"
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: retail-app
spec:
  selector:
    app: orders
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: retail-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: public.ecr.aws/aws-containers/retail-store-sample-checkout:0.7.0
          ports:
            - containerPort: 8080
          env:
            - name: RETAIL_CHECKOUT_PERSISTENCE_PROVIDER
              value: "redis"
            - name: REDIS_URL
              value: "redis://checkout-redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: retail-app
spec:
  selector:
    app: checkout
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-redis
  namespace: retail-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-redis
  template:
    metadata:
      labels:
        app: checkout-redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-redis
  namespace: retail-app
spec:
  selector:
    app: checkout-redis
  ports:
    - port: 6379
      targetPort: 6379
