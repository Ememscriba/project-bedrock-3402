apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStoreName }}
  namespace: {{ .Values.namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-db-secret
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.awsSecretKey }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.awsSecretKey }}
        property: password
    - secretKey: endpoint
      remoteRef:
        key: {{ .Values.externalSecrets.awsSecretKey }}
        property: endpoint
    - secretKey: dbname
      remoteRef:
        key: {{ .Values.externalSecrets.awsSecretKey }}
        property: dbname
